name: CI

# Build + calidad. En los PR corre solo; en develop/main lo llama pipeline.yml (etapa 1).
on:
  pull_request:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # El build no necesita claves reales.
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Verificar tipos (TypeScript)
        run: npm run typecheck

      - name: Pruebas unitarias con cobertura
        run: npm run test:cobertura

      - name: Resumen de cobertura
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const f = (k) => `| ${k} | ${t[k].pct}% |`;
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              ["## Cobertura de pruebas", "| Métrica | % |", "|---|---|",
               ...["lines", "statements", "functions", "branches"].map(f), ""].join("\n"));
          '

      - name: Compilar
        run: npm run build

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
